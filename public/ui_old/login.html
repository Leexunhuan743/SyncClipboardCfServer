<!doctype html>
<html lang="zh-CN" data-app="login">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · 剪贴板历史</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="自托管 SyncClipboard 服务器的 Web 界面：查看、搜索、预览与下载跨设备同步的剪贴板历史。"
    />
    <!-- 链接预览（Slack / iMessage / 微信 / 飞书都读这些）。
         刻意不含 og:image：图片必须是绝对 URL，而本项目的部署域名由使用者决定、构建时未知，
         写死一个错的绝对 URL 比不写更糟（会显示空白预览）。 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="登录 · 剪贴板历史" />
    <meta property="og:description" content="自托管 SyncClipboard 服务器的 Web 界面。" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/ui_old/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/ui_old/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/ui_old/apple-touch-icon.png" />
    <link rel="manifest" href="/ui_old/manifest.webmanifest" />
    <!-- theme-color 只有一条：由下面的**外链**脚本 theme-init.js 按**生效**主题（含应用内开关）
         写入（外链而非内联是为了让 CSP 保持 script-src 'self'，见该文件头注释）。
         media 门控的两条只跟随系统，用户在应用里切到深色时顶栏会仍是浅色。 -->
    <meta name="theme-color" content="#faf8f5" />
    <link rel="stylesheet" href="/ui_old/css/tokens.css" />
    <link rel="stylesheet" href="/ui_old/css/base.css" />
    <link rel="stylesheet" href="/ui_old/css/components.css" />
    <link rel="stylesheet" href="/ui_old/css/motion.css" />
    <link rel="stylesheet" href="/ui_old/css/auth.css" />
    <link rel="stylesheet" href="/ui_old/css/archive.css" />
    <!-- 模块预载：与 index.html 同一理由，清单按该页的 import 闭包（login → api → format / next-target） -->
    <link rel="modulepreload" href="/ui_old/js/api.js" />
    <link rel="modulepreload" href="/ui_old/js/format.js" />
    <link rel="modulepreload" href="/ui_old/js/next-target.js" />
    <!-- 首帧主题：阻塞式经典脚本（不是 module）。与列表页同一份实现，见文件头注释 -->
    <script src="/ui_old/js/theme-init.js"></script>
  </head>
  <body>
    <!-- 界面提示条：与列表页同一份选择（localStorage），见 index.html 的注释。 -->
    <div class="notice-bar" role="note" id="notice-bar">
      <svg class="notice-bar__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="8.4" stroke="currentColor" stroke-width="1.6" />
        <path d="M12 8.2h.01M12 11.2v4.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </svg>
      <span class="notice-bar__text">
        备用界面（V1）。默认界面在 <a href="/ui/">/ui/</a>。
      </span>
      <button class="notice-bar__close" type="button" id="notice-bar-close" aria-label="关闭提示">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
    </div>
    <main class="auth">
      <div class="auth__panel">
        <div class="auth__brand">
          <svg class="auth__mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3.5" y="5" width="17" height="15.5" rx="3" stroke="currentColor" stroke-width="1.6" />
            <path d="M9 5.2V4.4A1.4 1.4 0 0 1 10.4 3h3.2A1.4 1.4 0 0 1 15 4.4v.8" stroke="currentColor" stroke-width="1.6" />
            <path d="M8 11h8M8 15h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <div>
            <h1 class="auth__title">剪贴板历史</h1>
            <p class="auth__sub">登录以查看这台服务器上的同步记录</p>
          </div>
        </div>

        <form class="auth__form" id="login-form" novalidate>
          <p class="alert--error" id="login-error" role="alert" hidden></p>

          <div class="field">
            <label for="username">用户名</label>
            <input
              class="input"
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              required
            />
          </div>

          <div class="field">
            <label for="password">密码</label>
            <input
              class="input"
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>

          <button class="btn btn--primary auth__submit" id="login-submit" type="submit" data-loading="false">
            <span class="btn__label">登录</span>
          </button>
        </form>

        <p class="note">
          凭据与 SyncClipboard 客户端使用的一致（HTTP Basic 的 <code>USERNAME</code> /
          <code>PASSWORD</code>）。登录状态保存在本机 Cookie 中，24 小时后过期。
        </p>
      </div>
    </main>

    <script type="module" src="/ui_old/js/login.js"></script>
  </body>
</html>
