<!doctype html>
<html lang="zh-CN" data-app="history">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>剪贴板历史 · SyncClipboard</title>
    <meta name="color-scheme" content="light dark" />
    <!-- 私有实例，不该被搜索引擎收录 -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="自托管 SyncClipboard 服务器的 Web 界面：查看、搜索、预览与下载跨设备同步的剪贴板历史。"
    />
    <!-- 链接预览（Slack / iMessage / 微信 / 飞书都读这些）。
         刻意不含 og:image：图片必须是绝对 URL，而本项目的部署域名由使用者决定、构建时未知，
         写死一个错的绝对 URL 比不写更糟（会显示空白预览）。 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="剪贴板历史 · SyncClipboard" />
    <meta property="og:description" content="自托管 SyncClipboard 服务器的 Web 界面。" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/ui_v1/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/ui_v1/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/ui_v1/apple-touch-icon.png" />
    <link rel="manifest" href="/ui_v1/manifest.webmanifest" />
    <!-- theme-color 只有一条：由下面的**外链**脚本 theme-init.js 按**生效**主题（含应用内开关）
         写入（外链而非内联是为了让 CSP 保持 script-src 'self'，见该文件头注释）。
         media 门控的两条只跟随系统，用户在应用里切到深色时顶栏会仍是浅色。 -->
    <meta name="theme-color" content="#faf8f5" />
    <link rel="stylesheet" href="/ui_v1/css/tokens.css" />
    <link rel="stylesheet" href="/ui_v1/css/base.css" />
    <link rel="stylesheet" href="/ui_v1/css/layout.css" />
    <link rel="stylesheet" href="/ui_v1/css/components.css" />
    <link rel="stylesheet" href="/ui_v1/css/motion.css" />
    <!-- 模块预载：零构建的代价是依赖要按层发现——实测瀑布是 main(20ms) → 第二层(39ms) → icons/format(50-60ms)，
         到最后一层要花两个额外往返，而 icons.js 是首屏渲染必需的。入口之外的模块全部列在这里，
         浏览器在解析 main.js 之前就能并行拉取，瀑布压成一层。
         清单必须与该页的 import 闭包**完全一致**（多了浪费一个请求、少了留一段瀑布）。
         守卫：V2 → test/ui-contract.test.ts；V1 → test/ui-guard.test.ts（"预载清单 == import 闭包"）。 -->
    <link rel="modulepreload" href="/ui_v1/js/api.js" />
    <link rel="modulepreload" href="/ui_v1/js/store.js" />
    <link rel="modulepreload" href="/ui_v1/js/filters.js" />
    <link rel="modulepreload" href="/ui_v1/js/clipboard.js" />
    <link rel="modulepreload" href="/ui_v1/js/dom.js" />
    <link rel="modulepreload" href="/ui_v1/js/latest.js" />
    <link rel="modulepreload" href="/ui_v1/js/signalr.js" />
    <link rel="modulepreload" href="/ui_v1/js/format.js" />
    <link rel="modulepreload" href="/ui_v1/js/messages.js" />
    <link rel="modulepreload" href="/ui_v1/js/icons.js" />
    <link rel="modulepreload" href="/ui_v1/js/components/header.js" />
    <link rel="modulepreload" href="/ui_v1/js/components/stats.js" />
    <link rel="modulepreload" href="/ui_v1/js/components/toolbar.js" />
    <link rel="modulepreload" href="/ui_v1/js/components/list.js" />
    <link rel="modulepreload" href="/ui_v1/js/components/row-content.js" />
    <link rel="modulepreload" href="/ui_v1/js/components/pagination.js" />
    <link rel="modulepreload" href="/ui_v1/js/components/preview.js" />
    <link rel="modulepreload" href="/ui_v1/js/components/confirm.js" />
    <link rel="modulepreload" href="/ui_v1/js/components/toast.js" />
    <link rel="modulepreload" href="/ui_v1/js/components/info.js" />
    <!-- 首帧主题：阻塞式经典脚本（不是 module）。外链而非内联，见文件头注释（CSP） -->
    <script src="/ui_v1/js/theme-init.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">跳到主内容</a>

    <div class="page">
      <header class="app-header" id="app-header"></header>

      <main class="main" id="main">
        <!-- 失联提示：轮询/统计失败时由 main.js 的 setStale 显示，恢复后自动收起。
             用 role="status" 而不是 alert：它是持续状态，不该在读屏里抢断。 -->
        <div class="notice notice--warn" id="notice" role="status" hidden></div>

        <!-- 统计条：三个真实数字，由 js/components/stats.js 填充。
             首屏那一次走 `/ui/api/overview` 的合成快照（js/main.js 的 refreshOverview），
             此后切视图/写操作由 `refreshStats()` 补 `/ui/api/statistics` —— 两个来源，
             不是"全部来自 /ui/api/statistics"。 -->
        <section class="stats" id="stats" aria-label="用量统计"></section>

        <!-- 工具栏：筛选、搜索、每页条数 -->
        <div class="toolbar" id="toolbar"></div>

        <!-- 结果区挂载点。这里那份骨架是**JS 起来之前**的占位（它要盖住的是 `api.session()`
             那一个往返），JS 一挂上就被 `list.el` 整体替换（见 js/main.js 的 boot）。
             挂载之后的加载态由 js/components/list.js 自己画：行数按**当前页大小**给。
             这 3 行是静态 HTML 能给出的最大信息量 —— 每页条数存在 localStorage，静态页面读不到；
             而它的高度对布局没有影响（挂载时顶栏/统计/工具栏同时就位，整页本来就要重排一次）。
             行高必须与真实行同高（47px），那条绑定在 css/components.css 的 `.skeleton__row` 上。 -->
        <div id="results-mount">
          <section class="results" aria-label="剪贴板历史">
            <div class="skeleton" role="status" aria-label="正在加载剪贴板历史">
              <div class="skeleton__row"></div>
              <div class="skeleton__row"></div>
              <div class="skeleton__row"></div>
            </div>
          </section>
        </div>

        <nav class="pagination" id="pagination" aria-label="分页"></nav>
      </main>

      <footer class="app-footer">
        <div class="app-footer__inner">
          <span>剪贴板数据只保存在你自己的 Cloudflare 账户（D1 记录 + R2 文件），不经过任何第三方。</span>
          <span class="toolbar__spacer"></span>
          <!-- **本项目地址就是那个入口**（2026-09-18 用户定形）；悬停或键盘聚焦时向上拉出**致谢**面板，
               里面是**另外两个**项目。入口本身就是链接（点它开仓库），因此完全不需要 `<details>` 或
               脚本：展开由 CSS 的 `:hover` / `:focus-within` 驱动，触屏没有 hover，那边把面板改成
               常驻（见 components.css 的 `pointer: coarse` 分支）。
               `rel="noreferrer noopener"` 三个链接都要有：`target="_blank"` 的新页能通过
               `window.opener` 反向操作本页，而本页持有会话 Cookie。 -->
          <div class="footer-links">
            <a class="footer-links__trigger" href="https://github.com/Leexunhuan743/SyncClipboardCfServer" rel="noreferrer noopener" target="_blank"
              title="本项目的 GitHub 仓库：https://github.com/Leexunhuan743/SyncClipboardCfServer">
              SyncClipboard CfServer
              <svg class="footer-links__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 19V5" />
                <path d="M6.5 10.5 12 5l5.5 5.5" />
              </svg>
            </a>
            <!-- 面板的可访问名与可见标题**逐字一致**（「致谢如下项目」）：
                 两者不一致会违反"可见标签必须包含在可访问名里"（WCAG 2.5.3）。 -->
            <nav class="footer-links__panel" aria-label="致谢如下项目">
              <span class="footer-links__title">致谢如下项目</span>
              <a class="footer-links__item" href="https://github.com/Jeric-X/SyncClipboard" rel="noreferrer noopener" target="_blank">
                <span class="footer-links__name">SyncClipboard</span>
                <span class="footer-links__url">https://github.com/Jeric-X/SyncClipboard</span>
              </a>
              <a class="footer-links__item" href="https://github.com/ting1e/clipserver" rel="noreferrer noopener" target="_blank">
                <span class="footer-links__name">clipserver</span>
                <span class="footer-links__url">https://github.com/ting1e/clipserver</span>
              </a>
            </nav>
          </div>
        </div>
      </footer>
    </div>

    <!-- 提示条：复制成功/失败等瞬时反馈；成功态主要靠按钮自身标签持久表达 -->
    <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

    <noscript>
      <p class="noscript">本页面需要 JavaScript 才能显示剪贴板历史。请从官方客户端访问，或启用 JavaScript。</p>
    </noscript>

    <script type="module" src="/ui_v1/js/main.js"></script>
  </body>
</html>
