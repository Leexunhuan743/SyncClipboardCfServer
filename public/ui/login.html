<!doctype html>
<html lang="zh-CN" data-app="login">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · 剪贴板历史</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="自托管 SyncClipboard 服务器的 Web 界面：查看、搜索、预览与下载跨设备同步的剪贴板历史。"
    />
    <!-- 链接预览（Slack / iMessage / 微信 / 飞书都读这些）。
         刻意不含 og:image：图片必须是绝对 URL，而本项目的部署域名由使用者决定、构建时未知，
         写死一个错的绝对 URL 比不写更糟（会显示空白预览）。 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="登录 · 剪贴板历史" />
    <meta property="og:description" content="自托管 SyncClipboard 服务器的 Web 界面。" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/ui/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/ui/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/ui/apple-touch-icon.png" />
    <link rel="manifest" href="/ui/manifest.webmanifest" />
    <!-- theme-color 只有一条：由下面的内联脚本按**生效**主题（含应用内开关）写入。
         media 门控的两条只跟随系统，用户在应用里切到深色时顶栏会仍是浅色。 -->
    <meta name="theme-color" content="#faf8f5" />
    <link rel="stylesheet" href="/ui/css/tokens.css" />
    <link rel="stylesheet" href="/ui/css/base.css" />
    <link rel="stylesheet" href="/ui/css/components.css" />
    <link rel="stylesheet" href="/ui/css/motion.css" />
    <link rel="stylesheet" href="/ui/css/auth.css" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('sb-ui-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'dark' || saved === 'light' ? saved : prefersDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          // 让浏览器 UI（移动端顶栏/状态栏）跟随生效主题，而不是只跟随系统
          var meta = document.querySelector('meta[name="theme-color"]');
          var bg = meta && getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
          if (meta && bg) meta.setAttribute('content', bg);
        } catch (err) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <main class="auth">
      <div class="auth__panel">
        <div class="auth__brand">
          <svg class="auth__mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3.5" y="5" width="17" height="15.5" rx="3" stroke="currentColor" stroke-width="1.6" />
            <path d="M9 5.2V4.4A1.4 1.4 0 0 1 10.4 3h3.2A1.4 1.4 0 0 1 15 4.4v.8" stroke="currentColor" stroke-width="1.6" />
            <path d="M8 11h8M8 15h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <div>
            <h1 class="auth__title">剪贴板历史</h1>
            <p class="auth__sub">登录以查看这台服务器上的同步记录</p>
          </div>
        </div>

        <form class="auth__form" id="login-form" novalidate>
          <p class="auth__error" id="login-error" role="alert" hidden></p>

          <div class="field">
            <label for="username">用户名</label>
            <input
              class="input"
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              required
            />
          </div>

          <div class="field">
            <label for="password">密码</label>
            <input
              class="input"
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>

          <button class="btn btn--primary auth__submit" id="login-submit" type="submit" data-loading="false">
            <span class="btn__label">登录</span>
          </button>
        </form>

        <p class="auth__note">
          凭据与 SyncClipboard 客户端使用的一致（HTTP Basic 的 <code>USERNAME</code> /
          <code>PASSWORD</code>）。登录状态保存在本机 Cookie 中，24 小时后过期。
        </p>
      </div>
    </main>

    <script type="module" src="/ui/js/login.js"></script>
  </body>
</html>
