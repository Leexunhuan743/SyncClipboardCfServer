<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>剪贴板历史 · SyncClipboard</title>
    <meta name="color-scheme" content="light dark" />
    <!-- 私有实例，不该被搜索引擎收录。这一页只是跳转，没有任何内容。 -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/ui/favicon.svg" type="image/svg+xml" />
    <!-- 静态资源层会以 307 把 `/ui` 补成 `/ui/`，于是**这个文件**是 `/ui/` 的响应。
         它唯一的职责是把人送到应用本体（`/ui/app/`）。

         为什么需要这一层：页面在 `app/` 子目录下，而 `/ui/` 这个**目录**需要一个索引文件，
         否则请求会回落到 Worker 的 404 页 —— 用户点开 `/ui/` 看到「这个地址没有页面」，
         而应用其实就在隔壁。

         为什么用 `<meta http-equiv="refresh">` 而不是 `<script>location.replace()`：
         这一页由静态资源层出，受 `public/_headers` 的 CSP 约束（`script-src 'self'`），
         内联脚本会被直接拒掉；而 meta refresh 在任何 CSP 下都成立。
         `<link rel="canonical">` 给出语义上的正主。 -->
    <meta http-equiv="refresh" content="0; url=/ui/app/" />
    <link rel="canonical" href="/ui/app/" />
  </head>
  <body>
    <p><a href="/ui/app/">进入剪贴板历史</a></p>
  </body>
</html>
