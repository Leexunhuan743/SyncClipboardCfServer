<!doctype html>
<html lang="zh-CN" data-app="history">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>剪贴板历史 · SyncClipboard</title>
    <meta name="color-scheme" content="light dark" />
    <!-- 私有实例，不该被搜索引擎收录 -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="自托管 SyncClipboard 服务器的 Web 界面：查看、搜索、预览与下载跨设备同步的剪贴板历史。"
    />
    <!-- 链接预览（Slack / iMessage / 微信 / 飞书都读这些）。
         刻意不含 og:image：图片必须是绝对 URL，而本项目的部署域名由使用者决定、构建时未知，
         写死一个错的绝对 URL 比不写更糟（会显示空白预览）。 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="剪贴板历史 · SyncClipboard" />
    <meta property="og:description" content="自托管 SyncClipboard 服务器的 Web 界面。" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/ui/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/ui/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/ui/apple-touch-icon.png" />
    <link rel="manifest" href="/ui/manifest.webmanifest" />
    <!-- theme-color 只有一条：由下面的内联脚本按**生效**主题（含应用内开关）写入。
         media 门控的两条只跟随系统，用户在应用里切到深色时顶栏会仍是浅色。 -->
    <meta name="theme-color" content="#faf8f5" />
    <link rel="stylesheet" href="/ui/css/tokens.css" />
    <link rel="stylesheet" href="/ui/css/base.css" />
    <link rel="stylesheet" href="/ui/css/layout.css" />
    <link rel="stylesheet" href="/ui/css/components.css" />
    <link rel="stylesheet" href="/ui/css/motion.css" />
    <script>
      // 首帧之前定主题：放到样式表之后、渲染之前，避免深色用户看到一瞬白屏
      (function () {
        try {
          var saved = localStorage.getItem('sb-ui-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'dark' || saved === 'light' ? saved : prefersDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          // 让浏览器 UI（移动端顶栏/状态栏）跟随生效主题，而不是只跟随系统
          var meta = document.querySelector('meta[name="theme-color"]');
          var bg = meta && getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
          if (meta && bg) meta.setAttribute('content', bg);
        } catch (err) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <a class="skip" href="#main">跳到主内容</a>

    <div class="page">
      <header class="app-header" id="app-header"></header>

      <main class="main" id="main">
        <!-- 统计条：三个真实数字（来自 /ui/api/statistics），由 js/components/stats.js 填充 -->
        <section class="stats" id="stats" aria-label="用量统计"></section>

        <!-- 工具栏：筛选、搜索、每页条数 -->
        <div class="toolbar" id="toolbar"></div>

        <!-- 结果区挂载点：js/components/list.js 会把它替换成真正的表格/空状态 -->
        <div id="results-mount">
          <section class="results" aria-label="剪贴板历史">
            <div class="skeleton" id="skeleton">
              <div class="skeleton__row"></div>
              <div class="skeleton__row"></div>
              <div class="skeleton__row"></div>
            </div>
          </section>
        </div>

        <nav class="pagination" id="pagination" aria-label="分页"></nav>
      </main>

      <footer class="app-footer">
        <div class="app-footer__inner">
          <span>剪贴板数据只保存在你自己的 Cloudflare 账户（D1 记录 + R2 文件），不经过任何第三方。</span>
          <span class="toolbar__spacer"></span>
          <a href="https://github.com/Jeric-X/SyncClipboard" rel="noreferrer noopener" target="_blank"
            >SyncClipboard 客户端</a
          >
        </div>
      </footer>
    </div>

    <!-- 提示条：复制成功/失败等瞬时反馈；成功态主要靠按钮自身标签持久表达 -->
    <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

    <noscript>
      <p style="padding: 24px">本页面需要 JavaScript 才能显示剪贴板历史。请从官方客户端访问，或启用 JavaScript。</p>
    </noscript>

    <script type="module" src="/ui/js/main.js"></script>
  </body>
</html>
