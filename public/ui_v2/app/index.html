<!doctype html>
<html lang="zh-CN" data-app="history">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover：刘海屏/圆角屏上让 env(safe-area-inset-*) 拿到真实内边距，
         overlay-v2.css 用它把悬浮的批量条与提示条推出 Home Indicator。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>剪贴板历史 · SyncClipboard（开发测试版）</title>
    <meta name="color-scheme" content="light dark" />
    <!-- 私有实例，不该被搜索引擎收录 -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="自托管 SyncClipboard 服务器的 Web 界面：查看、搜索、预览与下载跨设备同步的剪贴板历史。"
    />
    <!-- 链接预览（Slack / iMessage / 微信 / 飞书都读这些）。
         刻意不含 og:image：图片必须是绝对 URL，而本项目的部署域名由使用者决定、构建时未知，
         写死一个错的绝对 URL 比不写更糟（会显示空白预览）。 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="剪贴板历史 · SyncClipboard（开发测试版）" />
    <meta property="og:description" content="自托管 SyncClipboard 服务器的 Web 界面。" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/ui_v2/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/ui_v2/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/ui_v2/apple-touch-icon.png" />
    <link rel="manifest" href="/ui_v2/manifest.webmanifest" />
    <!-- theme-color 只有一条：由 `/ui_v2/js/theme.js` 按**生效**主题（含应用内开关）写入。
         media 门控的两条只跟随系统，用户在应用里切到深色时顶栏会仍是浅色。 -->
    <meta name="theme-color" content="#f5f2ee" />

    <link rel="stylesheet" href="/ui_v2/css/tokens-v2.css" />
    <link rel="stylesheet" href="/ui_v2/css/base-v2.css" />
    <link rel="stylesheet" href="/ui_v2/css/shell-v2.css" />
    <link rel="stylesheet" href="/ui_v2/css/board-v2.css" />
    <link rel="stylesheet" href="/ui_v2/css/overlay-v2.css" />

    <!-- 模块预载：零构建的代价是依赖要按层发现。入口之外的模块全部列在这里，
         浏览器在解析 boot.js 之前就能并行拉取，把依赖瀑布压成一层。
         清单必须与该页入口的 import 闭包**完全一致**（多了浪费请求、少了留一段瀑布），
         守卫见 test/ui-contract.test.ts 的第一条用例。 -->
    <link rel="modulepreload" href="/ui_v2/js/api.js" />
    <link rel="modulepreload" href="/ui_v2/js/clipboard.js" />
    <link rel="modulepreload" href="/ui_v2/js/dom.js" />
    <link rel="modulepreload" href="/ui_v2/js/filters.js" />
    <link rel="modulepreload" href="/ui_v2/js/focus.js" />
    <link rel="modulepreload" href="/ui_v2/js/format.js" />
    <link rel="modulepreload" href="/ui_v2/js/icons.js" />
    <link rel="modulepreload" href="/ui_v2/js/keys.js" />
    <link rel="modulepreload" href="/ui_v2/js/latest.js" />
    <link rel="modulepreload" href="/ui_v2/js/menus.js" />
    <link rel="modulepreload" href="/ui_v2/js/messages.js" />
    <link rel="modulepreload" href="/ui_v2/js/paths.js" />
    <link rel="modulepreload" href="/ui_v2/js/push.js" />
    <link rel="modulepreload" href="/ui_v2/js/spark.js" />
    <link rel="modulepreload" href="/ui_v2/js/state.js" />
    <link rel="modulepreload" href="/ui_v2/js/theme.js" />
    <link rel="modulepreload" href="/ui_v2/js/ui/appbar.js" />
    <link rel="modulepreload" href="/ui_v2/js/ui/batchbar.js" />
    <link rel="modulepreload" href="/ui_v2/js/ui/blank.js" />
    <link rel="modulepreload" href="/ui_v2/js/ui/board.js" />
    <link rel="modulepreload" href="/ui_v2/js/ui/button.js" />
    <link rel="modulepreload" href="/ui_v2/js/ui/dialog.js" />
    <link rel="modulepreload" href="/ui_v2/js/ui/drawer.js" />
    <link rel="modulepreload" href="/ui_v2/js/ui/filters.js" />
    <link rel="modulepreload" href="/ui_v2/js/ui/ghost.js" />
    <link rel="modulepreload" href="/ui_v2/js/ui/menu.js" />
    <link rel="modulepreload" href="/ui_v2/js/ui/omnibox.js" />
    <link rel="modulepreload" href="/ui_v2/js/ui/overview.js" />
    <link rel="modulepreload" href="/ui_v2/js/ui/pager.js" />
    <link rel="modulepreload" href="/ui_v2/js/ui/row.js" />
    <link rel="modulepreload" href="/ui_v2/js/ui/rowops.js" />
    <link rel="modulepreload" href="/ui_v2/js/ui/toast.js" />

    <!-- 首帧主题：**阻塞式经典脚本**（不是 module —— module 默认 defer，会晚于首帧，
         深色用户会看到一帧白闪）。外链而非内联，这样 CSP 可以保持 `script-src 'self'`。 -->
    <script src="/ui_v2/js/theme-init.js"></script>
  </head>
  <body>
    <a class="skip" href="#board-area">跳到剪贴板列表</a>

    <div class="page">
      <header class="appbar" id="appbar"></header>

      <main class="main" id="main">
        <div class="workspace-heading">
          <div>
            <p class="workspace-heading__eyebrow">你的跨设备工作空间</p>
            <h1 class="workspace-heading__title">剪贴板历史</h1>
            <p class="workspace-heading__description">找回刚才的灵感，接着手边的工作。</p>
          </div>
          <a class="workspace-heading__link" href="https://github.com/Jeric-X/SyncClipboard" target="_blank" rel="noopener noreferrer">获取客户端 ↗</a>
        </div>
        <!-- 概览带：一眼掌握（场景 S3）。整条是按钮 —— 点开进抽屉看细则。 -->
        <button
          class="overview"
          id="overview"
          type="button"
          aria-haspopup="dialog"
          aria-label="打开概览与设置"
        ></button>

        <!-- 失联提示：轮询/统计失败时由 JS 的 setStale 显示，恢复后自动收起。
             用 role="status" 而不是 alert：它是持续状态，不该在读屏里抢断。 -->
        <div class="notice" id="notice" role="status" hidden></div>

        <!-- 主搜索：44px 高、全宽。最高频的动作（场景 S1/S2）拿最大的目标。 -->
        <div id="omnibox"></div>

        <!-- 筛选条：吸顶在顶栏之后。类型 chips 在左，状态筛选在右。 -->
        <div id="filters"></div>

        <!-- 列表区：JS 会把里面的骨架换成真正的表格/空状态 -->
        <div id="board-area" tabindex="-1"></div>

        <!-- 批量操作条：选中 ≥1 条时由 JS 取消 hidden。
             它在这里（列表之后、分页之前）而不是 `</body>` 之前，是为了**Tab 顺序**：
             这个条只在用户选中了行之后才出现，而键盘用户正常路径上一定会在行的复选框上按 Space ——
             若它挂在文档最末，要按 200 多次 Tab 才够得到它的按钮（实测：50 行/页时是第 224 个可聚焦项）。
             它是 `position: fixed` 悬浮的，所以位置不影响观感。 -->
        <div class="batchbar" id="batchbar" role="toolbar" aria-label="批量操作" hidden></div>

        <!-- 分页容器：这里用 `div` 而不是 `nav`，因为组件自己已经建了一个
             `<nav aria-label="分页">` —— 两个嵌套且同名的 nav 地标会让读屏用户
             无法在"地标列表"里区分它们（实测：地标列表里出现两个"分页"）。
             类名保持 `.pager`，计算样式与之前完全一致。 -->
        <div id="pager"></div>
      </main>

      <footer class="footer">
        <div class="footer__inner">
          <span>你的内容，在自己的服务器上同步。</span>
          <span class="footer__spacer"></span>
          <!-- 2026-09-18 定位翻转后这一条改叫「默认界面」：`/ui_v1/` 是默认入口（ADR D17），
               再叫"旧版"会让人以为它已经过时。 -->
          <a href="/ui_v1/" rel="noreferrer">默认界面</a>
          <a href="https://github.com/Jeric-X/SyncClipboard" rel="noreferrer noopener" target="_blank"
            >SyncClipboard</a
          >
          <a href="https://github.com/ting1e/clipserver" rel="noreferrer noopener" target="_blank"
            >clipserver</a
          >
        </div>
      </footer>
    </div>

    <!-- 提示条：复制/删除等动作的瞬时反馈；原地成功态主要靠按钮自身表达。
         `aria-live` 只在这里声明一次：里面的每条提示**不再**自带 `role="status"`，
         否则同一句话会被两个实时区域各播一遍。 -->
    <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

    <noscript>
      <p class="noscript">
        本页面需要 JavaScript 才能显示剪贴板历史。你可以用官方客户端访问本服务器，或启用 JavaScript。
      </p>
    </noscript>

    <script type="module" src="/ui_v2/js/boot.js"></script>
  </body>
</html>
