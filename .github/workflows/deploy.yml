# 自动部署 SyncClipboard CfServer 到 Cloudflare Workers
# 触发：push 到 master **且改动涉及产品代码/构建输入**，或 GitHub Actions 页面手动触发。
#       纯文档改动（README、docs/**、*.md、审计工件）不再空跑 CI —— 见下方 paths 白名单。
#
# 前置一次性配置（GitHub 仓库 Settings → Secrets and variables → Actions）：
#   Secrets:
#     CLOUDFLARE_API_TOKEN  — Cloudflare API Token，权限：
#                             Workers Scripts:Edit、D1:Edit、R2:Edit、Account Settings:Read
#     CLOUDFLARE_ACCOUNT_ID — Cloudflare 账户 ID（dashboard 右侧栏）
#     USERNAME / PASSWORD   — 可选。Basic Auth 凭据，配置后 CI 自动同步写入 Worker
#   Variables:
#     DEPLOY_URL            — 可选，部署后地址，用于冒烟检查（未设置则自动使用部署输出的地址）
#
# 凭据管理两种用法（任选）：
#   A) 手动设置：在本地执行 `npx wrangler secret put USERNAME / PASSWORD`，
#      GitHub Secrets 不填这两个凭据 —— CI 不触碰凭据。
#   B) 交给 CI（推荐）：在 GitHub Secrets 配好 USERNAME 与 PASSWORD，
#      每次部署自动同步至 Cloudflare Worker，无需敲命令行。

name: Deploy

on:
  push:
    branches: [master]
    # 白名单：只在这些路径变更时触发。文档与审计工件不在其中——它们既不改变部署产物，
    # 也不影响协议行为，此前每次提交空跑一遍 quality + deploy 是纯浪费。
    #
    # 两条刻意保留的边界：
    #   - public/** 是 Web 界面本体，随部署上线，属于产品代码（不是文档）；
    #   - test/** 是本仓库的质量门产物，改坏了不该静默合入；而且「文档口径守卫」也住在
    #     test/ 下（代价：纯文档改动触发的 CI 顺带校验的那次机会没有了，下一次代码改动仍会校验）。
    #
    # 这是**白名单**：将来新增部署输入（新的配置文件/目录）时必须同步加进列表，
    # 否则那次变更不会触发流水线。手动触发（workflow_dispatch）不受此限。
    paths:
      - 'src/**'                 # 协议实现
      - 'public/**'              # Web 界面（静态资源，随部署上线）
      - 'test/**'                # 测试套件 + 文档口径守卫
      - 'schema.sql'             # D1 表结构（部署时执行）
      - 'wrangler.toml'          # 部署配置（绑定、[assets]、[triggers]、[vars]）
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'eslint.config.js'       # 前端静态检查的配置（改坏了 lint 门禁就失效）
      - '.github/workflows/**'   # CI 自身
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  quality:
    # 真正的质量门：typecheck + lint + **全部 22 个套件**（含 HTTP 黑盒、Web 界面的 /ui/api 与文档口径守卫）。
    # 黑盒套件需要服务器：这里用 wrangler dev（miniflare）起一个本地实例，
    # 不触碰任何线上资源、也不需要 Cloudflare 凭据。
    # 单独成 job 有两个好处：与部署进程隔离（dev server 不残留），且失败即不部署。
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint（零构建前端：public/ui_v*/js 不在 tsc 的 include 里）
        run: npm run lint

      - name: Start local server (miniflare) and run all suites
        env:
          # 测试只读 SYNC_USER / SYNC_PASS（不用 USER/USERNAME —— 宿主环境已占用）
          SYNC_USER: ci-user
          SYNC_PASS: ci-password-${{ github.run_id }}
          BASE: http://127.0.0.1:8787
        run: |
          set -euo pipefail
          # 本地凭据文件（wrangler dev 读取）；仅存在于 CI 容器内，不涉及线上资源
          printf 'USERNAME=%s\nPASSWORD=%s\n' "$SYNC_USER" "$SYNC_PASS" > .dev.vars
          # 初始化本地 D1（幂等：schema.sql 用 CREATE IF NOT EXISTS）
          npx wrangler d1 execute syncclipboard --local --file=./schema.sql
          # 后台启动，等到端口就绪后再跑测试
          # --test-scheduled：让 cleanup 套件能经 GET /__scheduled 触发真实 Cron 处理器
          npx wrangler dev --local --test-scheduled --port 8787 --ip 127.0.0.1 > /tmp/wrangler-dev.log 2>&1 &
          echo $! > /tmp/wrangler-dev.pid
          for i in $(seq 1 60); do
            if curl -s -o /dev/null --max-time 2 "$BASE/" ; then ready=1; break; fi
            sleep 1
          done
          if [ "${ready:-0}" != "1" ]; then
            echo "dev server 未就绪，日志："; cat /tmp/wrangler-dev.log; exit 1
          fi
          # 全部套件（--no-file-parallelism：多个套件都会改写「当前 profile」，须串行）
          npx vitest run --no-file-parallelism
          kill "$(cat /tmp/wrangler-dev.pid)" || true

      - name: Upload dev server log on failure
        if: failure()
        # v4 也是 Node 20 运行时（实测 action.yml 的 runs.using），只在 quality 失败时才加载，
        # 因此它不会出现在成功运行的注解里——但真失败时同样会触发弃用警告。一并升到 v7（Node 24）。
        uses: actions/upload-artifact@v7
        with:
          name: wrangler-dev-log
          path: /tmp/wrangler-dev.log
          if-no-files-found: ignore

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Check required secrets
        # 未配置凭据时给出可诊断的指引，而不是让后续 wrangler 步骤以
        # "In a non-interactive environment, it's necessary to set a CLOUDFLARE_API_TOKEN…" 结束
        # （该报错不提示"去仓库 Settings 配置"，首次使用容易卡住）。
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "缺少仓库 secrets:$missing"
            echo "请在 Settings → Secrets and variables → Actions 中配置后重跑。"
            echo "所需权限：Workers Scripts:Edit、D1:Edit、R2:Edit、Account Settings:Read。"
            echo "（quality job 不需要这些凭据，其协议回归结果仍然有效。）"
            exit 1
          fi
          echo "secrets 已配置"

      - name: Check Cloudflare resources exist
        # 为什么有这一步：D1 的 `database_id` 与 R2 的 `bucket_name` 都写死在 wrangler.toml 里，
        # 而 CI 不创建、也无法创建资源（`database_id` 必须写回仓库文件）。全新账号 / fork 之后
        # 第一次部署时，缺资源会一直到后面的 `d1 execute` 或 `wrangler deploy` 才以 wrangler 的
        # 英文报错暴露出来。这里提前判定，改用**状态码**说话（不解析 wrangler 的 CLI 输出，
        # 免得输出格式一变就误判）：
        #   404  → 资源确实不在该账号里 → 打印中文指引并 fail fast
        #   其它 → 无法判定（权限不足、API 变化等）→ 只警告、不阻断
        # ——绝不因为一个探针把本来能成功的部署挡掉。
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          d1_id=$(grep -m1 '^database_id' wrangler.toml | sed -E 's/.*"(.*)".*/\1/')
          bucket=$(grep -m1 '^bucket_name' wrangler.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "wrangler.toml 声明：database_id=$d1_id  bucket=$bucket"

          MISSING=""
          probe() {  # $1 = 描述，$2 = API URL
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$2" || echo 000)
            case "$code" in
              200) echo "✓ $1 存在" ;;
              404) MISSING="$MISSING
          · $1 不存在（HTTP 404）" ;;
              *)   echo "::warning::$1 预检无法判定（HTTP $code），本项跳过（可能是令牌权限不含该资源的读权限）" ;;
            esac
          }

          probe "D1 数据库 $d1_id" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$d1_id"
          probe "R2 存储桶 $bucket" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$bucket"

          if [ -n "$MISSING" ]; then
            echo "缺少本次部署所需的 Cloudflare 资源：$MISSING"
            echo ""
            echo "请按 README「部署 → 方式 A」一次性创建，并把输出填回配置："
            echo "  1) npx wrangler d1 create syncclipboard          # 把输出的 database_id 填进 wrangler.toml 的 [[d1_databases]]"
            echo "  2) npx wrangler r2 bucket create syncclipboard   # 名称须与 wrangler.toml 的 bucket_name 一致"
            echo "  3) npx wrangler d1 execute syncclipboard --remote --file=./schema.sql"
            echo "  4) npx wrangler secret put USERNAME / PASSWORD"
            echo ""
            echo "本步骤只做判定、不自动创建：database_id 必须写进仓库里的 wrangler.toml。"
            exit 1
          fi
          echo "资源预检通过"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 schema (idempotent)
        run: npx wrangler d1 execute syncclipboard --remote --file=./schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Resolve deploy switches
        id: switches
        # 把「仓库变量（Settings → Secrets and variables → Actions → Variables）」解析成**有效的部署开关**，
        # 再传给后面的 Deploy 步骤。三个要点：
        #   ① **默认值兜底**：变量没配时用 wrangler.toml 里的默认语义（UI_ENABLED=true 等）——
        #      绝不能把空串绑给 Worker，那会覆盖掉配置里的默认值（wrangler-action 的 vars 输入按名取值）。
        #   ② **取值校验**：布尔只接受 true/false、整数只接受非负且不超量级，写错了当场红；
        #      否则会"静默按默认值跑"，与配置者预期相反。
        #   ③ 变量值经 env 传入、结果经 step outputs 传出，都不拼进脚本文本，避免被当成代码执行。
        # 同时写 GITHUB_ENV（供 shell 直接用同名变量）与 GITHUB_OUTPUT（供后续步骤的表达式引用）。
        env:
          IN_UI_ENABLED: ${{ vars.UI_ENABLED }}
          IN_ENFORCE_STRONG_CREDENTIALS: ${{ vars.ENFORCE_STRONG_CREDENTIALS }}
          IN_MAX_SAVED_HISTORY_COUNT: ${{ vars.MAX_SAVED_HISTORY_COUNT }}
          IN_HISTORY_RETENTION_MINUTES: ${{ vars.HISTORY_RETENTION_MINUTES }}
          IN_MAX_REQUEST_BODY_BYTES: ${{ vars.MAX_REQUEST_BODY_BYTES }}
          IN_AUTH_RATE_LIMIT_WINDOW_MS: ${{ vars.AUTH_RATE_LIMIT_WINDOW_MS }}
          IN_AUTH_RATE_LIMIT_MAX_FAILURES: ${{ vars.AUTH_RATE_LIMIT_MAX_FAILURES }}
          IN_AUTH_RATE_LIMIT_BLOCK_MS: ${{ vars.AUTH_RATE_LIMIT_BLOCK_MS }}
          IN_AUTH_RATE_LIMIT_BURST_WARN: ${{ vars.AUTH_RATE_LIMIT_BURST_WARN }}
        run: |
          set -euo pipefail

          emit() { # 名称 值
            echo "$1=$2" >> "$GITHUB_ENV"
            echo "$1=$2" >> "$GITHUB_OUTPUT"
          }
          note() { # 名称 原始值
            if [ -z "${2:-}" ]; then echo "（未配置，用默认值）"; else echo "（来自仓库变量）"; fi
          }

          resolve_bool() { # 名称 原始值 默认值
            local name="$1" raw="${2:-}" default="$3"
            if [ -z "$raw" ]; then raw="$default"; fi
            case "$raw" in
              true|false) ;;
              *) echo "::error::仓库变量 $name 只能是 true 或 false（当前 '$raw'）"; exit 1 ;;
            esac
            emit "$name" "$raw"
            echo "开关 $name = $raw $(note "$name" "${2:-}")"
          }

          resolve_int() { # 名称 原始值 默认值 下限 上限
            local name="$1" raw="${2:-}" default="$3" min="$4" max="$5"
            if [ -z "$raw" ]; then raw="$default"; fi
            case "$raw" in
              ''|*[!0-9]*) echo "::error::仓库变量 $name 必须是非负整数（当前 '$raw'）"; exit 1 ;;
            esac
            if [ "$raw" -lt "$min" ] || [ "$raw" -gt "$max" ]; then
              echo "::error::仓库变量 $name = $raw 超出允许范围 $min..$max"
              exit 1
            fi
            emit "$name" "$raw"
            echo "开关 $name = $raw $(note "$name" "${2:-}")"
          }

          # 界面开关默认**开**（与 wrangler.toml 的默认值一致）
          resolve_bool UI_ENABLED "${IN_UI_ENABLED}" true
          # 弱凭据硬失败默认**关**：线上当前用的就是文档化默认口令，置 true 会 fail-closed 直接切断同步
          resolve_bool ENFORCE_STRONG_CREDENTIALS "${IN_ENFORCE_STRONG_CREDENTIALS}" false
          # 历史保留策略：与 wrangler.toml 的默认一致（1000 条 / 7 天）
          resolve_int MAX_SAVED_HISTORY_COUNT "${IN_MAX_SAVED_HISTORY_COUNT}" 1000 1 1000000
          resolve_int HISTORY_RETENTION_MINUTES "${IN_HISTORY_RETENTION_MINUTES}" 10080 1 5256000
          # 请求体上限：默认 48MiB，允许 256KiB..64MiB（默认值贴着"实际会发生的大小"取，才留得住并发余量：
          # isolate 128MiB 被并发共享，默认 64 时两个大上传重叠就顶格；上限 64 离平台 100MiB 留 36MiB）
          resolve_int MAX_REQUEST_BODY_BYTES "${IN_MAX_REQUEST_BODY_BYTES}" 50331648 262144 67108864
          # 限速四参数：默认 15min / 10 次 / 15min / 50。**不建议改**（README 已写明），
          # 这里的范围校验只为拦住手滑写错的量级；运行期对越界值另有"回落默认"的兜底。
          resolve_int AUTH_RATE_LIMIT_WINDOW_MS "${IN_AUTH_RATE_LIMIT_WINDOW_MS}" 900000 60000 86400000
          resolve_int AUTH_RATE_LIMIT_MAX_FAILURES "${IN_AUTH_RATE_LIMIT_MAX_FAILURES}" 10 3 100
          resolve_int AUTH_RATE_LIMIT_BLOCK_MS "${IN_AUTH_RATE_LIMIT_BLOCK_MS}" 900000 60000 86400000
          resolve_int AUTH_RATE_LIMIT_BURST_WARN "${IN_AUTH_RATE_LIMIT_BURST_WARN}" 50 10 10000

      - name: Deploy Worker
        id: deploy
        # 版本选择（2026-09-15）：
        #   ① action 用 v4：它是 Node 24 运行时（v3 是 Node 20，GitHub 已发弃用警告）；
        #   ② **不再钉 wrangler 版本**：仓库的 devDependency 已升到 `wrangler ^4`，action v4 的默认
        #      wrangler 也是 v4 ⇒ 「测试用的」与「部署用的」是同一个大版本（此前仓库锁 v3、action 默认 v4，
        #      必须显式钉住 3.114.17 以免分叉；工具链升级后这个钉子已无必要，反而会锁住升级）。
        #      将来若再出现 devDependency 与 action 默认不一致，请显式钉回 devDependency 的版本。
        uses: cloudflare/wrangler-action@v4
        env:
          # 上一步解析出的**有效值**（默认值已兜底、非法值已拦下）。action 的 `vars` 输入按名取值，
          # 故这里必须与下面的名单逐字一致。
          UI_ENABLED: ${{ steps.switches.outputs.UI_ENABLED }}
          ENFORCE_STRONG_CREDENTIALS: ${{ steps.switches.outputs.ENFORCE_STRONG_CREDENTIALS }}
          MAX_SAVED_HISTORY_COUNT: ${{ steps.switches.outputs.MAX_SAVED_HISTORY_COUNT }}
          HISTORY_RETENTION_MINUTES: ${{ steps.switches.outputs.HISTORY_RETENTION_MINUTES }}
          MAX_REQUEST_BODY_BYTES: ${{ steps.switches.outputs.MAX_REQUEST_BODY_BYTES }}
          AUTH_RATE_LIMIT_WINDOW_MS: ${{ steps.switches.outputs.AUTH_RATE_LIMIT_WINDOW_MS }}
          AUTH_RATE_LIMIT_MAX_FAILURES: ${{ steps.switches.outputs.AUTH_RATE_LIMIT_MAX_FAILURES }}
          AUTH_RATE_LIMIT_BLOCK_MS: ${{ steps.switches.outputs.AUTH_RATE_LIMIT_BLOCK_MS }}
          AUTH_RATE_LIMIT_BURST_WARN: ${{ steps.switches.outputs.AUTH_RATE_LIMIT_BURST_WARN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 把开关绑成 Worker 变量（`vars` 输入 = 按**名字**取同名环境变量的值）。
          # 名单**只列在这里**：新增可调项时 = Resolve 步骤给默认值 + 这里加一行 + README 开关表加一行。
          vars: |
            UI_ENABLED
            ENFORCE_STRONG_CREDENTIALS
            MAX_SAVED_HISTORY_COUNT
            HISTORY_RETENTION_MINUTES
            MAX_REQUEST_BODY_BYTES
            AUTH_RATE_LIMIT_WINDOW_MS
            AUTH_RATE_LIMIT_MAX_FAILURES
            AUTH_RATE_LIMIT_BLOCK_MS
            AUTH_RATE_LIMIT_BURST_WARN

      - name: Sync Basic Auth credentials
        # 自动同步：只要在 GitHub Secrets 中配置了 USERNAME 与 PASSWORD，就自动写入 Cloudflare Worker。
        # 未配置时跳过（适合在本地通过 wrangler secret 手动管理凭据的用户）。
        #
        # 安全说明：
        # - 凭据只注入本步骤的 env（不设 job 级 env），否则 npm ci 的 postinstall 脚本也能读到它们。
        # - GitHub 会自动在日志中掩码 secrets 值。
        # - 放在 Deploy 之后：先完成部署，确保 Worker 实体已存在。
        if: ${{ secrets.USERNAME != '' && secrets.PASSWORD != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_USERNAME: ${{ secrets.USERNAME }}
          AUTH_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          printf '%s' "$AUTH_USERNAME" | npx wrangler secret put USERNAME
          printf '%s' "$AUTH_PASSWORD" | npx wrangler secret put PASSWORD
          echo "credentials synced to Worker"

      - name: Smoke check（只读）
        # 目标地址：优先仓库变量 DEPLOY_URL（自定义域名场景），否则用**上一步部署输出的地址**。
        # 后者是 wrangler-action 的 `deployment-url` 输出 ⇒ 不再依赖手工配置，因此每次部署都会真跑
        # （旧版这一步挂在 `if: vars.DEPLOY_URL != ''` 上，而该变量从未设置 ⇒ 一直静默跳过）。
        #
        # 断言全是**只读**的。**绝不** PUT /SyncClipboard.json —— 那会把线上当前剪贴板换掉。
        # ① 未认证 /api/version → 401：鉴权中间件在（500 则明确报「凭据未配置」并失败）
        # ② 已认证 /api/version → 200 且 body 等于 wrangler.toml 的 VERSION：凭据可用 **且**这次部署真生效
        # ③ 已认证 /api/history/statistics → 200 JSON：D1 绑定与查询路径可用
        # ④ 已认证 /SyncClipboard.json → 200 JSON：Meta /「当前 profile」读路径可用
        # ⑤ 界面可达性按 UI_ENABLED 断言：true → 三个挂载点（/ui_v1/ = 默认界面 V1、
        #    /ui_v2/ 与 /ui_v2/app/ = 开发测试版 V2、/ui/ = 跳转壳）的页面与入口 JS
        #    各 200，且 Content-Type 对得上（守住 run_worker_first + ASSETS 转发链路 ——
        #    它坏了界面就整片 404）；false → 三个挂载点都必须 404
        # 未配置 USERNAME/PASSWORD secrets 时 ②③④ 降级为 ::notice:: 跳过（本仓库按 README「方式 A」
        # 把凭据只放在 Cloudflare —— 那是预期状态，不该让部署变红）。
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          DEPLOYED_URL: ${{ steps.deploy.outputs.deployment-url }}
          SYNC_USER: ${{ secrets.USERNAME }}
          SYNC_PASS: ${{ secrets.PASSWORD }}
          # 界面开关的**实际生效值**（由 Resolve 步骤解析）——只用于决定断言该期望 200 还是 404
          UI_ENABLED: ${{ steps.switches.outputs.UI_ENABLED }}
        run: |
          set -uo pipefail
          base="${DEPLOY_URL:-${DEPLOYED_URL:-}}"
          base="${base%/}"
          if [ -z "$base" ]; then
            echo "::error::既没有 DEPLOY_URL 变量、也没有部署步骤输出的地址，冒烟无法执行。"
            echo "　部署本身已成功；把仓库变量 DEPLOY_URL 设为 Worker 地址即可让本步骤恢复。"
            exit 1
          fi
          echo "冒烟目标：$base"
          expected=$(grep -m1 '^VERSION' wrangler.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "wrangler.toml 的 VERSION = $expected"
          fail=0

          sleep 3
          code=$(curl -s -o /tmp/unauth.txt -w '%{http_code}' "$base/api/version" || echo 000)
          case "$code" in
            401) echo "✓ 未认证 /api/version → 401（鉴权生效）" ;;
            500) echo "::error::未认证 /api/version → 500：$(head -c 200 /tmp/unauth.txt)"
                 echo "　按设计，凭据未配置时本服务端 fail-closed 返回 500；请确认 USERNAME/PASSWORD secret 已设置。"
                 fail=1 ;;
            *)   echo "::error::未认证 /api/version → 期望 401，实际 $code：$(head -c 200 /tmp/unauth.txt)"
                 fail=1 ;;
          esac

          if [ -n "${SYNC_USER:-}" ] && [ -n "${SYNC_PASS:-}" ]; then
            AUTH=(-u "$SYNC_USER:$SYNC_PASS")
            body=$(curl -s "${AUTH[@]}" "$base/api/version" || true)
            if [ "$body" = "$expected" ]; then
              echo "✓ 已认证 /api/version → $body（凭据可用，且这次部署的版本已生效）"
            else
              echo "::error::已认证 /api/version 返回 '$body'，期望 '$expected'（凭据错，或本次部署未生效）"
              fail=1
            fi

            code=$(curl -s -o /tmp/stats.json -w '%{http_code}' "${AUTH[@]}" "$base/api/history/statistics" || echo 000)
            if [ "$code" = "200" ] && head -c 1 /tmp/stats.json | grep -q '{'; then
              echo "✓ 已认证 /api/history/statistics → 200 JSON（D1 绑定与查询路径可用）"
            else
              echo "::error::/api/history/statistics → $code $(head -c 200 /tmp/stats.json)"
              fail=1
            fi

            code=$(curl -s -o /tmp/profile.json -w '%{http_code}' "${AUTH[@]}" "$base/SyncClipboard.json" || echo 000)
            if [ "$code" = "200" ] && head -c 1 /tmp/profile.json | grep -q '{'; then
              echo "✓ 已认证 /SyncClipboard.json → 200 JSON（Meta /「当前 profile」读路径可用）"
            else
              echo "::error::/SyncClipboard.json → $code $(head -c 200 /tmp/profile.json)"
              fail=1
            fi
          else
            echo "::notice::未配置 USERNAME/PASSWORD secrets，跳过三条已认证断言（版本比对 / statistics / SyncClipboard.json）。按 README「方式 A」凭据只存在于 Cloudflare，这是预期状态；要启用它们，把两个值配成仓库 secrets 即可。"
          fi

          # ⑤ 界面可达性：按 UI_ENABLED 的实际生效值断言（无副作用，只是 GET）
          #
          # 断言的单位是「页面 + 入口 JS」**成对**（每个挂载点各一对），且**校验 Content-Type**：
          # 模块脚本拿到 HTML 错误页时状态码可能仍是 200，但浏览器解析会失败、整张模块图挂掉
          # （表现为页面停在骨架屏）—— 只看状态码抓不到这一种。
          #
          # ⚠️ **入口名必须跟着界面走**：2026-09-16 的 V2 重做把入口从 `js/main.js` 换成了
          # `js/boot.js`，而这条断言仍写着旧名 ⇒ 连续两次流水线在冒烟步骤变红（`wrangler deploy`
          # 其实成功了，红的是这条断言）。V1 那一对是 2026-09-17 补的：它重新纳入维护后同样要有
          # 真实可达的页面与模块。**2026-09-19 改名**（ui_old→ui_v1、ui→ui_v2，且 `/ui/` 降为
          # 跳转壳）：下面六条路径全部跟着变过一次，漏改就是又一次"部署成功但冒烟红"。
          check_asset() { # $1=路径 $2=说明 $3=期望的 Content-Type 前缀
            local p="$1" what="$2" want="$3" code ctype
            read -r code ctype <<<"$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$base$p" || echo '000 -')"
            if [ "$code" != "200" ]; then
              echo "::error::$p → $code，期望 200（$what）"
              return 1
            fi
            case "$ctype" in
              "$want"*)
                echo "✓ $p → 200（$what，Content-Type: $ctype）"
                ;;
              *)
                echo "::error::$p 的 Content-Type 是 '$ctype'，期望以 '$want' 开头（$what）"
                return 1
                ;;
            esac
          }

          if [ "${UI_ENABLED:-true}" = "false" ]; then
            # 关掉界面时**三个挂载点都必须 404** —— 否则"关掉界面"会留下一个仍可访问的旧界面，
            # 那正是这个开关要消除的东西（与 test/ui-guard.test.ts 的同名断言对应）。
            for p in /ui/ /ui_v1/ /ui_v2/; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$base$p" || echo 000)
              if [ "$code" = "404" ]; then
                echo "✓ UI_ENABLED=false：$p → 404（界面已关闭）"
              else
                echo "::error::UI_ENABLED=false 时 $p 期望 404，实际 $code"
                fail=1
              fi
            done
          else
            check_asset '/ui/' '跳转壳（老书签入口，指向默认界面 /ui_v1/）' 'text/html' || fail=1
            check_asset '/ui/js/redirect-hash.js' '跳转壳脚本（经 Worker → ASSETS 转发）' 'text/javascript' || fail=1
            check_asset '/ui_v1/' '默认界面入口（V1）' 'text/html' || fail=1
            check_asset '/ui_v1/js/main.js' 'V1 模块（经 Worker → ASSETS 转发）' 'text/javascript' || fail=1
            check_asset '/ui_v2/app/' 'V2 开发测试版本体' 'text/html' || fail=1
            check_asset '/ui_v2/js/boot.js' 'V2 模块（经 Worker → ASSETS 转发）' 'text/javascript' || fail=1
          fi

          if [ "$fail" != "0" ]; then exit 1; fi
          echo "冒烟通过（全部只读，未修改线上任何数据）"
