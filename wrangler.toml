name = "syncclipboard-cf-server"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# ============ 绑定 ============
# CI 部署前按**库名**（`database_name`）解析出真实 D1 id，注入 runner 里的配置副本，
# **不回写仓库**（见 .github/workflows/deploy.yml 的 Resolve Cloudflare resources）。
# 想固定到某个库（例如保护已有数据不被误重建）就设仓库变量 `D1_DATABASE_ID`，它优先于按名解析。
[[d1_databases]]
binding = "DB"
database_name = "syncclipboard"
# 占位值（全零 UUID）：真实 id 是"创建那一刻才产生的 UUID"，写死进仓库对 fork 的人一定是错的。
# 本地开发不读它 —— wrangler dev / d1 execute --local 用 miniflare 本地库，绑定只按 binding 名建立。
database_id = "00000000-0000-0000-0000-000000000000"

# R2：file/ 暂存区 + history/{Type}_{Hash}/ 持久数据文件
[[r2_buckets]]
binding = "R2"
bucket_name = "syncclipboard"

# Durable Object：SignalR 兼容 Hub（持有 WebSocket 连接并广播）
[durable_objects]
bindings = [{ name = "HUB", class_name = "SyncClipboardHub" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncClipboardHub"]

# 公开变量
[vars]
# /api/version 返回值 = 上游基线编译后真实会返回的那个串。唯一事实源是上游
# src/Directory.Build.props 的 VersionPrefix/VersionSuffix，与本仓库自己的 package.json 版本
# 是两套互不相干的编号，切勿"顺手对齐"。功能上无影响：官方客户端只要求 >= 3.1.1，且版本解析
# 失败时该检查被静默跳过。跟版规则：仅当上游改动版本事实源时才改这里，并同步 docs/protocol.md §10。
VERSION = "3.3.0-beta1"
# 历史保留策略（对齐上游 AppSettings.MaxSavedHistoryCount / HistoryRetentionMinutes）。
# 可被同名 GitHub 仓库变量覆盖（不配则用这里的默认值，下游 src/cleanup.ts）。
# ⚠️ 保留期的上游语义是「0 = 不限制」：默认不做按时间的清理，只由条数上限兜底。
MAX_SAVED_HISTORY_COUNT = "1000"
HISTORY_RETENTION_MINUTES = "0"
# Web 界面开关（默认开）。设为 "false" 时四个挂载点（/ui、/ui_v1、/ui_v2、/ui_shared 及静态资源）
# 与 /ui/api/* 一律 404，根路径对浏览器也不再跳转；协议面完全不受影响。
# 判定与行为见 src/uiEnabled.ts；**只有显式 "false" 才关**，其余（含未设置）都是开。
UI_ENABLED = "true"

# 保留/清理定时任务：CF 侧统一为每 20 分钟一次批量执行（对齐上游 HistoryCleaner 的三类任务，
# 见 src/cleanup.ts）。分钟位取 7/27/47（避开整点/整十分）。
[triggers]
crons = ["7,27,47 * * * *"]

# ============ 可观测性（Workers Logs）============
# 声明 enabled 后 console.* 与平台调用日志写入账户，可在控制台按 Worker/时间/文本查询。
# 显式声明而不是依赖"新建 Worker 默认已开"这一平台默认（默认会变，日志丢了不会报错）。
# head_sampling_rate 保持默认 1 = 全量。日志里不出现剪贴板正文（见 README「日志与排障」）。
[observability]
enabled = true

# ============ 静态资源（Web UI）============
# 四个挂载点：
#   /ui_shared/ ← public/ui_shared/   V1/V2 共用的静态资产（品牌图标 + 共用图标表）
#   /ui_v1/     ← public/ui_v1/       V1，默认界面（产品面）
#   /ui_v2/     ← public/ui_v2/       V2，开发测试版；应用本体在 /ui_v2/app/
#   /ui/        ← public/ui/          只留一层跳转壳，把人送到 /ui_v1/
#                                     （接口命名空间 `/ui/api/*` 是服务端路由，见 src/ui/routes.ts）
# 这四个前缀统一受 UI_ENABLED 管：关掉界面时都不该还能拿到界面的东西。
# 协议路径（/、/api/*、/SyncClipboard.json、/file/*、Hub）落在 Worker 上，与它们无重叠。
# 注意：这里**不能**放 public/index.html —— 根路径要留给 PROPFIND（客户端的探活与目录列举）。
#
# run_worker_first：让界面前缀的请求**先进 Worker**，由 Worker 按 UI_ENABLED 决定转静态资源
# （env.ASSETS.fetch）还是 404。不加这一条时静态资源在 Worker 之前就被托管掉了，界面开关无从生效
# （对**已存在的资源**，边缘命中即返回、请求到不了 Worker）。代价：界面请求多过一层 Worker。
# binding = "ASSETS" 是 run_worker_first 的前提。挂载点判据由 test/ui-guard.test.ts 从 public/ 动态发现。
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/ui", "/ui/*", "/ui_v1", "/ui_v1/*", "/ui_v2", "/ui_v2/*", "/ui_shared", "/ui_shared/*"]

# ============ Secrets（wrangler secret put，不要写进仓库）============
# USERNAME / PASSWORD —— 与官方服务器相同的 HTTP Basic Auth 凭据
