name = "syncclipboard-cf-server"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# ============ 绑定（部署前需创建资源并填入真实 ID）============

# D1：历史记录表 HistoryRecords + 元信息表 Meta（含当前剪贴板 Profile）
# 创建：wrangler d1 create syncclipboard
#
# ⚠️ `database_id` 是**占位值**（全零 UUID），有两层原因：
#   ① 它是"创建那一刻才产生的 UUID"，写死进仓库对 fork 的人一定是错的（那是上一个账号的 id）；
#   ② 本地开发**不读**它 —— `wrangler dev` / `d1 execute --local` 用的是 miniflare 的本地库，
#      绑定只按 `binding` 名建立，所以占位值不影响 `npm run dev` 与全部测试。
# CI 的做法：部署前按**库名**（`database_name`）解析出真实 id，注入 runner 里的这份配置副本
# （见 `.github/workflows/deploy.yml` 的 "Resolve Cloudflare resources"），**不回写仓库**。
# 想固定到某个库（例如保护已有数据不被误重建）就设仓库变量 `D1_DATABASE_ID`，它会优先于按名解析。
[[d1_databases]]
binding = "DB"
database_name = "syncclipboard"
database_id = "00000000-0000-0000-0000-000000000000"

# R2：file/ 暂存区 + history/{Type}_{Hash}/ 持久数据文件
# 创建：wrangler r2 bucket create syncclipboard
[[r2_buckets]]
binding = "R2"
bucket_name = "syncclipboard"

# Durable Object：SignalR 兼容 Hub（持有 WebSocket 连接并广播）
[durable_objects]
bindings = [{ name = "HUB", class_name = "SyncClipboardHub" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncClipboardHub"]

# 公开变量
[vars]
# /api/version 返回值 = 上游基线（28c7e596）编译后**真实会返回的那个串**：上游
# `src/Directory.Build.props` 是版本唯一事实源（VersionPrefix=3.2.0 / VersionSuffix 空），
# `SyncClipboardProperty.AppVersion` 取程序集 AssemblyInformationalVersion 并截掉 '+' 之后的部分
# ⇒ 该基线的 /api/version 返回 "3.2.0"。此处**逐字对齐上游**，与本仓库自身的 package.json 版本
# （迁移项目版本号，当前 1.25.2）是两套互不相干的编号，切勿"顺手对齐"。
# 跟版规则：仅当上游改动版本事实源（bump `<VersionPrefix>` 或换版本来源）时才改这里，
# 并同步 docs/protocol.md §10 的登记行。
# 功能上无影响：官方客户端只要求服务端 >= 3.1.1（Env.RequestServerVersion="3.1.1"），
# 且 AppVersion.TryParse 解析失败时该检查会被静默跳过（OfficialAdapter 里 if 无 else）。
VERSION = "3.2.0"
# 历史保留策略（对齐上游 appsettings AppSettings.MaxSavedHistoryCount / HistoryRetentionMinutes）
# 这两个值可被 GitHub 仓库变量覆盖（同名）：CI 部署时若配置了 MAX_SAVED_HISTORY_COUNT /
# HISTORY_RETENTION_MINUTES，会以 --var 覆盖此处；不配就用这里的默认值（下游：src/cleanup.ts）。
MAX_SAVED_HISTORY_COUNT = "1000"
HISTORY_RETENTION_MINUTES = "10080"
# Web 界面开关（默认开）。GitHub 仓库变量 UI_ENABLED=false 可关掉整个界面：三个挂载点
# （/ui、/ui_v1、/ui_v2 及各自的 /*，含静态资源）与 /ui/api/* 一律 404，
# 根路径对浏览器也不再跳转；协议面（/api/*、/SyncClipboard.json、/file/*、Hub）完全不受影响。
# 判定与行为见 src/uiEnabled.ts；**只有显式 "false" 才关**，其余（含未设置）都是开。
# 注：默认值写在这里而不是只放 CI，是为了"本地 wrangler dev 与线上同一套默认行为"。
UI_ENABLED = "true"

# 保留/清理定时任务（对齐上游 HistoryCleaner：保留期+条数上限 10 分钟、已删硬删+孤儿目录 12 小时）
# CF 侧统一为**每 20 分钟**一次批量执行（见 src/cleanup.ts）。取 20 分钟而不是上游的 10 分钟：
# 每轮吞吐已提到"批 500、每条只花 1 次子请求（广播）"，20 分钟一轮的收敛速度已与上游同量级；
# 再快只会增加 Cron 调用与日志噪音（每轮 5 行 [cleanup]）。分钟位取 7/27/47（避开整点/整十分）。
[triggers]
crons = ["7,27,47 * * * *"]

# ============ 可观测性（Workers Logs）============
# Cloudflare 侧没有"日志级别"概念（上游的 Logging:LogLevel 在此无对应物）；日志的可查询面就是 Workers Logs：
# 声明 enabled 后，console.* 与平台调用日志会写入账户，可在控制台 Workers & Pages → 选 Worker → Observability
# 按 Worker/时间/文本查询，保留 7 天。**显式声明**而不是依赖"新建 Worker 默认已开"这一平台默认
# （默认会变，日志丢了不会报错）。head_sampling_rate 保持默认 1 = 全量；按本仓库规模（单个官方客户端的
# 探活就有 ~17.3k 请求/天 ⇒ 调用日志 ≲1M 条/月）远在 2000 万条/月的免费额度内。
# 另注：日志里不出现剪贴板正文（见 README「日志与排障」）。
[observability]
enabled = true

# ============ 静态资源（Web UI）============
# 三个挂载点（2026-09-19 改名：ui_old → ui_v1、ui → 应用本体并入 ui_v2）：
#   /ui_v1/  ← public/ui_v1/   **V1，默认界面**（产品面）
#   /ui_v2/  ← public/ui_v2/   V2，开发测试版；应用本体在 /ui_v2/app/
#   /ui/     ← public/ui/      **只留一层跳转壳**（index.html + js/redirect-hash.js），
#                              把人送到 /ui_v1/。保留它是因为 `/ui/api/*` 这个接口
#                              命名空间必须以 `/ui/` 为前缀（服务端路由，见 src/ui/routes.ts），
#                              而它下面正好也是老书签的入口；壳不承载应用。
# 协议路径（/、/api/*、/SyncClipboard.json、/file/*、Hub）都落在 Worker 上，与上面三个前缀无重叠；
# 没有对应资源的请求（含全部协议请求）继续回落给 Worker 处理。
# 注意：这里**不能**放 public/index.html —— 根路径要留给 PROPFIND（客户端的探活与目录列举）。
#
# run_worker_first（2026-09-15 新增）：让界面前缀的请求**先进 Worker**，由 Worker 根据
# UI_ENABLED 决定"转回静态资源（env.ASSETS.fetch）"还是"404"。不加这一条时静态资源在 Worker
# **之前**就被托管掉了，界面开关无从生效（要关就只能改仓库/删资源）。
# 代价：界面请求多经过一层 Worker；协议面与根路径不受影响（只有这几个模式进 Worker）。
# binding = "ASSETS" 是上面 run_worker_first 的前提：没有它，Worker 里拿不到静态资源绑定。
#
# 为什么 V1 这一面**必须**在名单里：2026-09-18 补进来之前它刻意不在，理由是"只有一个静态资源面、
# 由边缘直接托管最省一层往返"，并声称"界面开关对它仍然生效（未命中的请求会回落给 Worker）"——
# 那句话对**已存在的资源**是错的：边缘命中资源就直接返回，请求根本到不了 Worker，
# 于是 UI_ENABLED=false 时 V1 照样把整个界面服务出去（开关只在"资源未命中"这一路有效）。
# 它是默认入口，这条必须成立。守卫见 test/ui-guard.test.ts。
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/ui", "/ui/*", "/ui_v1", "/ui_v1/*", "/ui_v2", "/ui_v2/*"]

# ============ Secrets（wrangler secret put，不要写进仓库）============
# USERNAME / PASSWORD —— 与官方服务器相同的 HTTP Basic Auth 凭据
